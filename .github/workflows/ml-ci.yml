name: ml-ci

# Lint + unit tests for the ML code. The optional hosted-API Docker smoke test
# was removed — the batch setup serves the model as JSON via scripts/mlClient.js
# and never builds a container, so there was nothing for it to protect.
on:
  pull_request:
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]
  push:
    branches: [main]
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]   # workflow edits now trigger
  workflow_dispatch: {}                                # manual "Run workflow" button

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Lean deps: everything the linter + both test files need, without the
      # heavy training-only packages (lightgbm, mlflow).
      - run: pip install -r requirements-serve.txt ruff pytest httpx
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest tests/ -q
