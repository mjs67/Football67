name: ml-ci

# Runs on every PR/push that touches the ML code. Fast gate: lint + unit tests,
# then build the serving image and confirm the container answers /health.
on:
  pull_request:
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]
  push:
    branches: [main]
    paths: ["ml/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt ruff pytest httpx
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Train a model to bake into the test image
        working-directory: ml
        run: |
          pip install -r requirements.txt
          # Build a small synthetic training set so the image has a real model.
          python - <<'PY'
          import json, numpy as np, models as M
          rng = np.random.default_rng(0); rows=[]
          for _ in range(300):
              r=dict.fromkeys(M.FEATURE_ORDER,0.0)
              d=rng.normal(150,120)
              r.update(home_rating=1600+d, away_rating=1600, rating_diff=d,
                       g_home=1.45, g_away=1.15, home_att=1, home_def=1,
                       away_att=1, away_def=1, kickoff="2026-01-01")
              r["homeScore"]=int(rng.poisson(1.45*np.exp(0.002*d)))
              r["awayScore"]=int(rng.poisson(1.15))
              rows.append(r)
          json.dump(rows, open("scripts_training.json","w"))
          PY
          MPLBACKEND=Agg python train.py --data scripts_training.json --pkl model.pkl
      - name: Build image
        working-directory: ml
        run: docker build -t football67-model:ci .
      - name: Smoke test container
        run: |
          docker run -d -p 8080:8080 --name model-smoke football67-model:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/health && break || sleep 2
          done
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'
          curl -sf -X POST http://localhost:8080/predict \
            -H 'Content-Type: application/json' \
            -d '{"home_rating":1800,"away_rating":1500,"rating_diff":360}' \
            | grep -q '"lh"'
          docker rm -f model-smoke
