# Free automation via GitHub Actions (no Cloud Functions / Blaze plan needed).
#
# Repo secrets required (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT   the full JSON of your service account key
#   FOOTBALL_DATA_TOKEN        free key from football-data.org
#
# Repo variable (optional):
#   COMPETITION                e.g. WC, PL, CL, EC, PD, BL1, SA  (default PL)

name: automation

# Run JS actions on Node 24 (silences the Node 20 deprecation warning)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: "*/30 * * * *" # sync fixtures, results, odds + leaderboard every 30 min
  workflow_dispatch: {}     # run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
      - name: Sync fixtures & results, recompute leaderboard
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          COMPETITION: ${{ vars.COMPETITION }}
        run: node scripts/syncMatches.js
